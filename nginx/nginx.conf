events {
    worker_connections 1024;
}

http {
    # Формат логов с временем ответа апстрима (удобно отслеживать тормоза LLM)
    log_format rag_log '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log rag_log;

    # Ограничение скорости запросов (Rate Limiting):
    # 10 запросов в минуту с одного IP (защита ru-en-RoSBERTa и LLM от спама)
    limit_req_zone $binary_remote_addr zone=rag_limit:10m rate=10r/m;
    limit_req_status 429;

    map $http_x_admin_key $rag_admin_authorized {
        default 0;
        include /run/secrets/rag_admin_keys.conf;
    }

    # Внутренний адрес FastAPI-сервиса[cite: 1]
    upstream rag_backend {
        server rag-service:8001;
    }

    server {
        listen 80;

        # Максимальный размер загружаемого PDF (для /ingest)[cite: 1]
        client_max_body_size 50M;

        # 1. Публичный эндпоинт для вопросов к RAG[cite: 1]
        location /api/v1/rag/ask {
            # Разрешаем всплеск до 5 запросов в очереди без задержки
            limit_req zone=rag_limit burst=5 nodelay;

            proxy_pass http://rag_backend;
            proxy_http_version 1.1;

            # Проброс реальных заголовков клиента и Request-ID[cite: 1]
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # Критично для LLM: увеличиваем таймаут ожидания ответа до 2 минут[cite: 1]
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;

            # Критично для SSE (стриминга токенов по словам): отключаем буферизацию[cite: 1]
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # 2. Административный эндпоинт загрузки документов[cite: 1]
        location /api/v1/ingest {
            # Ключи для X-Admin-Key загружаются из файла секретов.
            if ($rag_admin_authorized = 0) {
                return 403 '{"detail": "Forbidden: invalid admin key"}';
            }

            proxy_pass http://rag_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;

            # Парсинг больших PDF через Docling может занять время[cite: 1]
            proxy_read_timeout 300s;
        }

        # 3. Проброс Swagger UI / OpenAPI для удобной отладки
        location ~ ^/(docs|openapi.json|health) {
            proxy_pass http://rag_backend;
            proxy_set_header Host $host;
        }
    }
}
